name: 株価データ自動更新 & GitHub Pages デプロイ

on:
  schedule:
    # 毎週月曜 10:00 JST (01:00 UTC) に自動実行
    - cron: '0 1 * * 1'
  push:
    # デフォルトブランチへの push でも再デプロイ（マージ時に反映）
    branches:
      - claude/stock-portfolio-beginners-x4zDC
      - main
    paths-ignore:
      - 'public/data/prices.json'
  workflow_dispatch:
    # GitHub の Actions タブから手動実行も可能

permissions:
  contents: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Node.js 22 をセットアップ
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: 依存パッケージをインストール
        run: npm ci

      - name: 最新株価を取得して prices.json を更新
        run: node scripts/update-stocks.mjs

      - name: 変更をコミット（価格に変動があった場合のみ）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="$(git rev-parse --abbrev-ref HEAD)"
          # コミット前に最新状態を取得（価格取得中に別コミットが積まれても安全）。
          # prices.json の未ステージ変更を autostash で一時退避してから rebase。
          git fetch origin "$BRANCH"
          git -c rebase.autoStash=true rebase "origin/$BRANCH"
          git add public/data/prices.json
          if git diff --staged --quiet; then
            echo "株価に変動なし。コミットをスキップ。"
          else
            git commit -m "chore: 株価データを自動更新 $(date +%Y-%m-%d)"
            git push origin "$BRANCH"
          fi

      - name: アプリをビルド
        run: npm run build

      - name: gh-pages ブランチにデプロイ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # dist の内容を一時保存
          cp -r dist /tmp/kabu-dist-deploy

          # gh-pages ブランチを worktree として別ディレクトリに展開
          # （現在のブランチのファイルを汚さない）
          git fetch origin gh-pages || true
          git worktree add /tmp/gh-pages-deploy gh-pages 2>/dev/null || \
            git worktree add /tmp/gh-pages-deploy --orphan gh-pages

          # gh-pages の中身を dist で上書き
          rm -rf /tmp/gh-pages-deploy/*
          cp -r /tmp/kabu-dist-deploy/. /tmp/gh-pages-deploy/

          cd /tmp/gh-pages-deploy
          git add -A
          DEPLOY_DATE=$(date +%Y-%m-%d)
          git commit -m "Deploy: 株価自動更新 ${DEPLOY_DATE}" || echo "変更なし"
          git push origin gh-pages --force
