name: 株価データ自動更新 & GitHub Pages デプロイ

on:
  schedule:
    # 毎週月曜 10:00 JST (01:00 UTC) に自動実行
    - cron: '0 1 * * 1'
  workflow_dispatch:
    # GitHub の Actions タブから手動実行も可能

permissions:
  contents: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Node.js 20 をセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 依存パッケージをインストール
        run: npm ci

      - name: 最新株価を取得して prices.json を更新
        run: node scripts/update-stocks.mjs

      - name: 変更をコミット（価格に変動があった場合のみ）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/prices.json
          if git diff --staged --quiet; then
            echo "株価に変動なし。コミットをスキップ。"
          else
            git commit -m "chore: 株価データを自動更新 $(date +%Y-%m-%d)"
            git push
          fi

      - name: アプリをビルド
        run: npm run build

      - name: gh-pages ブランチにデプロイ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 現在のブランチ名を記録
          CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)

          # dist の内容を一時保存
          cp -r dist /tmp/kabu-dist-deploy

          # gh-pages ブランチに切り替え（存在しなければ作成）
          git fetch origin gh-pages 2>/dev/null || true
          git checkout gh-pages 2>/dev/null || git checkout --orphan gh-pages

          # 既存ファイルを削除して dist の内容をコピー
          git rm -rf . --quiet 2>/dev/null || true
          cp -r /tmp/kabu-dist-deploy/. .

          git add index.html assets/ favicon.svg icons.svg 2>/dev/null || git add -A

          DEPLOY_DATE=$(date +%Y-%m-%d)
          git commit -m "Deploy: 株価自動更新 ${DEPLOY_DATE}" || echo "変更なし"
          git push origin gh-pages --force

          # 元のブランチに戻す
          git checkout "$CURRENT_BRANCH"
