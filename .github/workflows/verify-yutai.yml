name: 優待データ月次再検証リマインダー

# 毎月1日 10:00 JST に GitHub Issue を1件自動作成するだけのワークフロー。
# Issue を見たら Claude Code のチャットで「優待を再検証して」と依頼すると、
# Claude が src/data/stocks.ts を最新IRと照合して修正PRを作成する運用。
# API キー等のシークレットは不要（GITHUB_TOKEN のみ使用）。

on:
  schedule:
    - cron: '0 1 1 * *'  # 毎月1日 10:00 JST (01:00 UTC)
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  open-reminder-issue:
    runs-on: ubuntu-latest
    steps:
      - name: 月次リマインダー Issue を作成（重複は作らない）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TITLE="優待データの月次再検証（$(TZ=Asia/Tokyo date +%Y-%m)）"
          # 同タイトルの open Issue が既にあればスキップ
          EXISTING=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq 'length')
          if [ "$EXISTING" -gt 0 ]; then
            echo "既存の Issue があるためスキップ: $TITLE"
            exit 0
          fi
          BODY=$(cat <<'EOF'
          ## 月次の優待データ検証リマインダー

          `src/data/stocks.ts` の優待情報が最新かどうか、Claude にお願いして再検証する時期です。

          ### やること
          Claude Code のチャットで以下のように依頼してください:

          > このIssueの内容に沿って、`src/data/stocks.ts` の全銘柄について最新の株主優待情報を信頼できる情報源（各社IR・minkabu・kabuyutai.com・株主優待ガイド net-ir）で再検証し、差分があれば修正してPRを作成してください。

          Claude が以下を確認します:
          - 優待の廃止・改悪・新設・株式分割
          - 上場廃止・社名変更・コード取り違え
          - 100株（最低単元）保有時の優待内容・金額・権利月・継続保有条件
          - 1株あたり年間配当の更新

          ### 確認・マージ
          差分が見つかった場合、Claude が新ブランチを切って PR を作成します。
          PR 内容を確認のうえマージしてください。

          差分が無い場合は Claude が「変更なし」と報告し、この Issue は閉じて構いません。

          ---
          このリマインダーは `.github/workflows/verify-yutai.yml` で毎月1日に自動作成されます。
          EOF
          )
          gh issue create --title "$TITLE" --body "$BODY" --label "verify-yutai" 2>/dev/null || \
            gh issue create --title "$TITLE" --body "$BODY"
